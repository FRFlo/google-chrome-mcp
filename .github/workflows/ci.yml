name: Build, test and publish

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t google-chrome-mcp:test .

      - name: Start container
        run: |
          docker run -d --name google-chrome-mcp \
            -e VNC_PASSWORD=ci-only-password \
            -p 3000:3000 -p 5900:5900 -p 6080:6080 -p 9222:9222 \
            google-chrome-mcp:test

      - name: Wait for MCP and run smoke tests
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null 2>&1; then break; fi
            sleep 2
          done
          MCP_BASE_URL=http://127.0.0.1:3000 CDP_URL=http://127.0.0.1:9222 bash tests/smoke.sh

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Cleanup
        if: always()
        run: docker rm -f google-chrome-mcp 2>/dev/null || true

