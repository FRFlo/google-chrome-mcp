services:
  chrome-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: google-chrome-mcp:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_PORT: ${MCP_PORT:-3000}
      VNC_PORT: ${VNC_PORT:-5900}
      NOVNC_PORT: ${NOVNC_PORT:-6080}
      SCREEN_WIDTH: ${SCREEN_WIDTH:-1920}
      SCREEN_HEIGHT: ${SCREEN_HEIGHT:-1080}
      MAX_SESSIONS: ${MAX_SESSIONS:-4}
      SESSION_TTL_MS: ${SESSION_TTL_MS:-1800000}
    ports:
      - "${MCP_PORT:-3000}:${MCP_PORT:-3000}"
      - "${VNC_PORT:-5900}:${VNC_PORT:-5900}"
      - "${NOVNC_PORT:-6080}:${NOVNC_PORT:-6080}"
    volumes:
      - chrome-sessions:/data/sessions
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:$${MCP_PORT}/mcp | grep -Eq '^(200|400|405)$'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  chrome-sessions:

