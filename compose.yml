services:
  chrome-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: google-chrome-mcp:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_PORT: ${MCP_PORT:-3000}
      VNC_PORT: ${VNC_PORT:-5900}
      NOVNC_PORT: ${NOVNC_PORT:-6080}
      VNC_PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in .env}
      SCREEN_WIDTH: ${SCREEN_WIDTH:-1920}
      SCREEN_HEIGHT: ${SCREEN_HEIGHT:-1080}
      CHROME_DATA_DIR: ${CHROME_DATA_DIR:-/data/chrome}
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/data/downloads}
    ports:
      - "${MCP_PORT:-3000}:3000"
      - "${VNC_PORT:-5900}:5900"
      - "${NOVNC_PORT:-6080}:6080"
    volumes:
      - chrome-data:/data/chrome
      - chrome-downloads:/data/downloads
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9222/json/version >/dev/null && curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/mcp | grep -Eq '^(200|400|405)$'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  chrome-data:
  chrome-downloads:

